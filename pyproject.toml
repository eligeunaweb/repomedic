[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "repomedic"
version = "0.3.0"
description = "Offline-first repository health checker"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "eligeunaweb"}]
keywords = ["security", "repository", "audit", "cli"]
[project.scripts]
repomedic = "repomedic.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
